name: toad

on:
  # The reliable clock: an external scheduler (cron-job.org) starts this workflow every
  # 30 minutes through GitHub's API, so day and night switch on time.
  workflow_dispatch:
  # Backup only: GitHub throttles scheduled workflows and in practice runs this every few hours.
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

# Runs from both triggers queue up instead of racing each other to push.
concurrency:
  group: toad
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Calotriton/git-toad@main
        with:
          skin: meadow
          output-dir: toad
          latitude: "41.39" # Barcelona; use your own pond's coordinates
          longitude: "2.17"

      # Commits only when the picture changed: the new day, first light and last light.
      - name: Commit the toad
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add toad
          git diff --cached --quiet && exit 0
          git commit -m "toad: pond update"
          git pull --rebase
          git push
